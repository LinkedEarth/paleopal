name: Update notebook corpus

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - update-notebooks

permissions:
  contents: write

jobs:
  update-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out AI repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Update notebook corpus
        run: |
          python backend/libraries/notebook_library/scripts/update_notebooks.py \
            --manifest backend/libraries/notebook_library/notebook_manifest.yml \
            --output backend/libraries/notebook_library/my_notebooks

      - name: Commit notebook updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain backend/libraries/notebook_library/my_notebooks) ]]; then
            git add backend/libraries/notebook_library/my_notebooks
            git commit -m "Update notebook corpus"
            git push
          else
            echo "No notebook changes to commit."
          fi
