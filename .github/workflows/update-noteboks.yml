name: Update notebook and general libraries

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-notebooks]

permissions:
  contents: write

jobs:
  update-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Check out AI repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Update notebook corpus
        run: |
          python backend/libraries/notebook_library/scripts/update_notebooks.py \
            --manifest backend/libraries/notebook_library/notebook_manifest.yml \
            --output backend/libraries/notebook_library/my_notebooks

      - name: Update general Markdown library
        run: |
          python backend/libraries/general_library/scripts/update_markdown.py \
            --manifest backend/libraries/general_library/general_manifest.yml \
            --output backend/libraries/general_library/my_library

      - name: Commit library updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain backend/libraries/notebook_library/my_notebooks backend/libraries/general_library/my_library) ]]; then
            git add backend/libraries/notebook_library/my_notebooks
            git add backend/libraries/general_library/my_library
            git commit -m "Update notebook and general libraries"
            git push
          else
            echo "No library changes to commit."
          fi
