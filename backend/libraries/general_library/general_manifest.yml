sources:
  - name: pyleoclim_tutorials
    display_name: Pyleoclim Tutorials
    source_type: repo_folder
    repo: https://github.com/LinkedEarth/PyleoTutorials.git
    owner: LinkedEarth
    repository: PyleoTutorials
    branch: main
    preferred_branch: jupyterbook
    destination_path: pyleoclim_tutorials
    include:
      - "*.md"
      - "**/*.md"
    exclude:
      - "**/.ipynb_checkpoints/**"
      - "**/_build/**"
      - "**/.git/**"
    license: Apache-2.0

  - name: pylipd_tutorials
    display_name: PyLiPD Tutorials
    source_type: repo_folder
    repo: https://github.com/LinkedEarth/pylipdTutorials.git
    owner: LinkedEarth
    repository: pylipdTutorials
    branch: main
    preferred_branch: jupyterbook
    destination_path: pylipd_tutorials
    include:
      - "*.md"
      - "**/*.md"
    exclude:
      - "**/.ipynb_checkpoints/**"
      - "**/_build/**"
      - "**/.git/**"
    license: Apache-2.0

  - name: paleobooks_gallery
    display_name: PaleoBooks Gallery
    source_type: gallery_csv
    repo: https://github.com/LinkedEarth/PaleoBooks.git
    owner: LinkedEarth
    repository: PaleoBooks
    branch: main
    csv_path: doc/cookbook_gallery.csv
    destination_path: paleobooks_gallery
    preferred_branch: jupyterbook
    include:
      - "*.md"
      - "**/*.md"
    exclude:
      - "**/.ipynb_checkpoints/**"
      - "**/_build/**"
      - "**/.git/**"
    license: mixed